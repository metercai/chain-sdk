[package]
name = "chain-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "ChainSdk: chain-capability contract (Mock/Centralized/Chain) for Verifier/Issuer with two service-side key namespaces"
repository = "https://github.com/metercai/chain-sdk"
readme = "README.md"
keywords = ["did", "vc", "substrate", "chain", "sdk"]
categories = ["authentication", "cryptography"]

[workspace]
# 与 did-sdk 一致：resolver 3 启用 MSRV 感知解析（rust-version = 1.88）。
resolver = "3"
members = ["."]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/metercai/chain-sdk"

[workspace.dependencies]
# 外部依赖：由 did-sdk 仓库发布；pin tag 保证可重现构建。
# 本地联调可临时加 [patch] 指向 ../did-sdk（不提交）。
keyvault-core = { git = "https://github.com/metercai/did-sdk", tag = "v0.2.0", package = "keyvault-core" }
did-sdk = { git = "https://github.com/metercai/did-sdk", tag = "v0.2.0" }

async-trait = "0.1.91"
async-lock = "3"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
secrecy = "0.10"
hex = "0.4"
dirs = "6"
# SD-JWT（sha-256 盐化哈希；base64url；base58 proof 编码）
sha2 = "0.10"
base64 = "0.22"
bs58 = "0.5"
getrandom = "0.4"

tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
# musl 静态：必须 rustls（纯 Rust TLS），禁止 native-tls / openssl。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }
subxt = "0.50"

wiremock = "0.6"
tempfile = "3"
serial_test = "3"
temp-env = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies]
keyvault-core = { workspace = true }
did-sdk = { workspace = true }
async-trait = { workspace = true }
async-lock = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
secrecy = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
subxt = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
temp-env = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }

[features]
default = []
# 能力子集（S17）：仅做 feature 门控，避免 Verifier 拉入全量依赖。
did-resolution = []
vc-wallet = []
issuer-signing = []
# VC 选择性披露（SD-JWT 机制，见 规格书 §7）。
sd-jwt = []
# 未来密钥后端扩展点。
device-keystore = []
server-keystore = []

[[example]]
name = "mini_cli"
path = "examples/mini_cli.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
